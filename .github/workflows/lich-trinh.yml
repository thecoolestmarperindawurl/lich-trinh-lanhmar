name: LANHMAR Lich Trinh Automation

# LUU Y: khong dung "schedule:" (cron noi bo cua GitHub Actions) nua vi
# GitHub xep hang su kien schedule theo kieu best-effort, hay bi tre hang
# gio hoac bi bo hoan toan khi tai cao. Lich chay chinh xac duoc dieu
# khien tu ben ngoai (cron-job.org) goi thang API workflow_dispatch vao
# dung gio - xem SETUP.md muc "Cron chinh xac voi cron-job.org".
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "update / morning / evening"
        required: true
        default: "update"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Cap nhat lich trinh tuan
        if: github.event.inputs.mode == 'update'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_schedule.py

      - name: Nhac lich quan trong
        if: github.event.inputs.mode == 'morning' || github.event.inputs.mode == 'evening'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/remind_important.py ${{ github.event.inputs.mode }}

      - name: Commit index.html neu co thay doi
        if: github.event.inputs.mode == 'update'
        run: |
          git config user.name "lanhmar-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto cap nhat lich trinh $(TZ=Asia/Ho_Chi_Minh date +%d/%m)"
          git push
